name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Esto te permite activar la compilación manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar SDK de Android
      uses: android-actions/setup-android@v3

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x gradlew
      continue-on-error: true

    - name: Compilar APK de Depuración (Debug)
      run: ./gradlew assembleDebug
      
    - name: Subir la APK generada
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
